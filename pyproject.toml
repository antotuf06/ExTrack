[project]
name = "extrack"
version = "0.1.0"
description = "Personal single-user dashboard for expenses and investments."
readme = "README.md"
requires-python = ">=3.12"
# No dependency here may make network calls at runtime (see CLAUDE.md: ask first).
dependencies = [
    "fastapi>=0.115",
    "fastapi-cli>=0.0.7",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "apscheduler>=3.10,<4",
    "tzdata>=2024.2", # zoneinfo data for Europe/Rome on Windows
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2>=2.16.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DTZ", "PTH", "RUF"]

[tool.ruff.format]
quote-style = "double"
